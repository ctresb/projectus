<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { width: 700px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); }
  .sw { padding: 20px 18px; min-height: 130px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--ink); color: var(--ink); }
  .sw:last-child { border-right: 0; }
  .pink   { background: #FE3867; }
  .yellow { background: #FAD344; }
  .green  { background: #61E141; }
  .blue   { background: #55B9F7; }
  .name { font-family: var(--font-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
  .hex { font-family: var(--font-mono); font-size: 12px; }
  .role { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; }
  .ftr { border-top: 1px solid var(--ink); padding: 10px 24px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-fg2); }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw pink">
      <div class="name">Pink</div>
      <div>
        <div class="hex">#FE3867</div>
        <div class="role">default · err</div>
      </div>
    </div>
    <div class="sw yellow">
      <div class="name">Yellow</div>
      <div>
        <div class="hex">#FAD344</div>
        <div class="role">warn · highlight</div>
      </div>
    </div>
    <div class="sw green">
      <div class="name">Green</div>
      <div>
        <div class="hex">#61E141</div>
        <div class="role">ok · success</div>
      </div>
    </div>
    <div class="sw blue">
      <div class="name">Blue</div>
      <div>
        <div class="hex">#55B9F7</div>
        <div class="role">info · links</div>
      </div>
    </div>
  </div>
  <div class="ftr">accents · pick ONE per surface · never mix</div>
</body>
</html>
