<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--fg1); }
  body { width: 700px; padding: 28px 32px; box-sizing: border-box; }
  .big { font-family: var(--font-mono); font-weight: 700; font-size: 46px; line-height: 1.0; margin: 0 0 14px; letter-spacing: -0.02em; }
  .accent { color: var(--accent-pink); }
  .line { font-family: var(--font-mono); font-size: 14px; line-height: 1.7; color: var(--fg1); }
  .dim { color: var(--fg2); }
  .meta { display: flex; justify-content: space-between; margin-top: 18px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg3); }
  .weights { display: flex; gap: 22px; align-items: baseline; margin: 10px 0 6px; font-family: var(--font-mono); font-size: 18px; }
  .w400 { font-weight: 400; }
  .w500 { font-weight: 500; }
  .w600 { font-weight: 600; }
  .w700 { font-weight: 700; }
  .wlabel { font-size: 9px; opacity: 0.55; letter-spacing: 0.1em; vertical-align: super; margin-left: 1px; color: var(--fg3); }
</style>
</head>
<body>
  <div class="big">$ zenship send<span class="accent">_</span></div>
  <div class="line"><span class="dim">→ building</span> apex.zenship.dev <span class="dim">·</span> <span style="color:var(--accent-lime)">38ms</span></div>
  <div class="weights">
    <span class="w400">Aa<span class="wlabel">400</span></span>
    <span class="w500">Aa<span class="wlabel">500</span></span>
    <span class="w600">Aa<span class="wlabel">600</span></span>
    <span class="w700">Aa<span class="wlabel">700</span></span>
  </div>
  <div class="meta">
    <span>mono · jetbrains mono</span>
    <span>--font-mono</span>
  </div>
</body>
</html>
