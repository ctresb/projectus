<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { width: 700px; padding: 26px 32px; box-sizing: border-box; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-fg2); }
  .input {
    font-family: var(--font-mono); font-size: 14px;
    background: var(--paper);
    border: 1px solid var(--ink);
    padding: 12px 14px;
    color: var(--ink);
  }
  .input::placeholder { color: var(--ink-mute); }
  .input.focus { outline: 2px solid var(--accent-pink); outline-offset: 2px; }
  .input.err { border-color: var(--accent-pink); border-width: 2px; padding: 11px 13px; }
  .err-msg { font-family: var(--font-mono); font-size: 11px; color: var(--accent-pink); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .check { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 13px; }
  .box { width: 16px; height: 16px; border: 1px solid var(--ink); background: var(--paper); display: inline-flex; align-items: center; justify-content: center; }
  .box.on { background: var(--ink); color: var(--accent-pink); font-size: 12px; line-height: 1; }
</style>
</head>
<body>
  <div class="row">
    <div class="field">
      <div class="label">project name</div>
      <input class="input" value="apex" />
    </div>
    <div class="field">
      <div class="label">region</div>
      <input class="input focus" value="us-east-1" />
    </div>
  </div>
  <div class="field">
    <div class="label">domain</div>
    <input class="input err" value="not a domain" />
    <div class="err-msg">→ must look like apex.zenship.dev</div>
  </div>
  <div class="row">
    <div class="check"><span class="box on">×</span> deploy preview on push</div>
    <div class="check"><span class="box"></span> bust edge cache</div>
  </div>
</body>
</html>
