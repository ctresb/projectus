<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 700px; background: var(--paper); display: grid; grid-template-columns: 1fr 1fr; }
  .col { padding: 22px 24px; min-height: 220px; box-sizing: border-box; }
  .light { background: var(--paper); color: var(--ink); border-right: 1px solid var(--ink); }
  .dark  { background: var(--ink); color: var(--fg1); }
  .row { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed currentColor; opacity: 1; }
  .row:last-child { border-bottom: 0; }
  .label { font-family: var(--font-mono); font-size: 12px; }
  .var { font-family: var(--font-mono); font-size: 10px; opacity: 0.55; }
  .eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.6; margin-bottom: 14px; }
  .s1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.03em; }
  .s2 { opacity: 0.7; }
  .s3 { opacity: 0.45; font-size: 11px; }
  .s4 { opacity: 0.28; font-size: 11px; }
</style>
</head>
<body>
  <div class="col light">
    <div class="eyebrow">text on paper</div>
    <div class="row"><span class="s1">Ship it.</span><span class="var">--ink-fg1 · #0A0A0A</span></div>
    <div class="row"><span class="label s2">Secondary copy, descriptions</span><span class="var">--ink-fg2</span></div>
    <div class="row"><span class="label s3">tertiary · captions · meta</span><span class="var">--ink-fg3</span></div>
    <div class="row"><span class="label s4">disabled / placeholder</span><span class="var">--ink-mute</span></div>
  </div>
  <div class="col dark">
    <div class="eyebrow">text on ink</div>
    <div class="row"><span class="s1">Ship it.</span><span class="var">--fg1 · #F5F2EA</span></div>
    <div class="row"><span class="label s2">Secondary copy, descriptions</span><span class="var">--fg2</span></div>
    <div class="row"><span class="label s3">tertiary · captions · meta</span><span class="var">--fg3</span></div>
    <div class="row"><span class="label s4">disabled / placeholder</span><span class="var">--fg-mute</span></div>
  </div>
</body>
</html>
