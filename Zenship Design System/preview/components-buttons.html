<!DOCTYPE html>
<html lang="en" data-accent="pink">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { width: 700px; padding: 28px 32px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 18px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-fg2); }
  .note { font-family: var(--font-mono); font-size: 10px; color: var(--ink-fg3); margin-top: 18px; letter-spacing: 0.04em; }

  /* All buttons share base motion: 180ms with the brand's ease */
  .btn {
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --dur:  180ms;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-weight: 600; font-size: 13px;
    padding: 12px 18px;
    border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper);
    text-transform: lowercase; letter-spacing: 0.02em;
    cursor: pointer;
    position: relative;
    transition:
      transform     var(--dur) var(--ease),
      box-shadow    var(--dur) var(--ease),
      background    var(--dur) var(--ease),
      color         var(--dur) var(--ease),
      border-color  var(--dur) var(--ease);
    will-change: transform;
  }
  .btn .arr { color: var(--accent-pink); transition: transform 220ms var(--ease); }

  /* ----- Primary: layered shadow easing in/out ----- */
  .btn-primary { box-shadow: 6px 6px 0 0 var(--ink); }
  .btn-primary:hover {
    transform: translate(-2px, -2px);
    box-shadow: 8px 8px 0 0 var(--ink);
  }
  .btn-primary:active {
    transform: translate(6px, 6px);
    box-shadow: 0 0 0 0 var(--ink);
    transition-duration: 90ms;
  }
  .btn-primary:hover .arr { transform: translateX(2px); }

  /* ----- Secondary: paper -> ink color swap, very gentle ----- */
  .btn-secondary {
    background: var(--paper); color: var(--ink);
  }
  .btn-secondary:hover {
    background: var(--ink); color: var(--paper);
    transform: translateY(-1px);
  }
  .btn-secondary:active { transform: translateY(0); transition-duration: 80ms; }
  .btn-secondary:hover .arr { transform: translateX(3px); }

  /* ----- Ghost: underline slides in from the left ----- */
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 0;
    padding: 12px 0;
    border-radius: 0;
    overflow: hidden;
  }
  .btn-ghost::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 4px;
    height: 2px;
    background: var(--ink);
    transform: scaleX(1);
    transform-origin: left;
    transition: transform 220ms var(--ease), background 180ms var(--ease);
  }
  .btn-ghost:hover { color: var(--accent-pink); }
  .btn-ghost:hover::after {
    background: var(--accent-pink);
    transform: scaleX(0.6);
    transform-origin: right;
  }
  .btn-ghost:active::after { transform: scaleX(0.85); transition-duration: 100ms; }

  /* ----- Destructive: pink ground, settles on press ----- */
  .btn-destructive {
    background: var(--accent-pink); color: var(--ink); border-color: var(--ink);
    box-shadow: 4px 4px 0 0 var(--ink);
  }
  .btn-destructive .arr { color: var(--ink); }
  .btn-destructive:hover {
    transform: translate(-1px, -1px);
    box-shadow: 6px 6px 0 0 var(--ink);
    background: #ff4f7a; /* slight lift in the pink */
  }
  .btn-destructive:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 0 var(--ink);
    transition-duration: 90ms;
  }
</style>
</head>
<body>
  <div class="grid">
    <div class="col">
      <button class="btn btn-primary"><span class="arr">$</span> zenship send</button>
      <div class="lbl">primary · shadow eases in · 180ms</div>
    </div>
    <div class="col">
      <button class="btn btn-secondary">read docs <span class="arr">→</span></button>
      <div class="lbl">secondary · 1px lift · fg/bg swap</div>
    </div>
    <div class="col">
      <button class="btn btn-ghost">cancel</button>
      <div class="lbl">ghost · underline retracts to accent</div>
    </div>
    <div class="col">
      <button class="btn btn-destructive"><span class="arr">!</span> rollback</button>
      <div class="lbl">destructive · shadow grows on hover</div>
    </div>
  </div>
  <div class="note">→ hover and hold each button to feel it. 180ms ease-out on rest, 90ms snap on press. no springs, no glow, no scale jiggles.</div>
</body>
</html>
