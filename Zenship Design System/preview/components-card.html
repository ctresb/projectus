<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { width: 700px; padding: 26px 32px; box-sizing: border-box; font-family: var(--font-mono); }
  .card { border: 1px solid var(--ink); background: var(--paper); padding: 0; }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--ink); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
  .body { padding: 18px 16px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
  .title { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.03em; color: var(--ink); }
  .sub { font-size: 12px; color: var(--ink-fg2); margin-top: 4px; }
  .num { font-family: var(--font-mono); font-weight: 700; font-size: 36px; line-height: 1; color: var(--ink); letter-spacing: -0.02em; }
  .num .u { font-size: 14px; color: var(--ink-fg2); font-weight: 400; margin-left: 4px; }
  .acc { color: var(--accent-pink); }
  .foot { display: flex; justify-content: space-between; padding: 10px 16px; border-top: 1px dashed var(--hair); font-size: 11px; color: var(--ink-fg2); }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span><span class="acc">●</span> apex · production</span>
      <span style="color:var(--ink-fg2)">us-east-1</span>
    </div>
    <div class="body">
      <div>
        <div class="title">apex.zenship.dev</div>
        <div class="sub">3 functions · 1 region · deployed 4m ago by you</div>
      </div>
      <div class="num">38<span class="u">ms</span></div>
    </div>
    <div class="foot">
      <span>commit a7c91d · main</span>
      <span>tail logs <span class="acc">→</span></span>
    </div>
  </div>
</body>
</html>
