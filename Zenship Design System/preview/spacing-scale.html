<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { width: 700px; padding: 22px 32px; box-sizing: border-box; }
  .row { display: flex; align-items: flex-end; gap: 6px; }
  .bar { background: var(--ink); position: relative; }
  .bar::after { content: attr(data-name); position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-fg3); white-space: nowrap; }
  .bar::before { content: attr(data-val); position: absolute; left: 50%; top: -16px; transform: translateX(-50%); font-family: var(--font-mono); font-size: 10px; color: var(--ink); }
  .ftr { margin-top: 36px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-fg2); }
</style>
</head>
<body>
  <div style="height:20px"></div>
  <div class="row">
    <div class="bar" data-name="s-1" data-val="4"  style="width:4px;  height:4px;"></div>
    <div class="bar" data-name="s-2" data-val="8"  style="width:8px;  height:8px;"></div>
    <div class="bar" data-name="s-3" data-val="12" style="width:12px; height:12px;"></div>
    <div class="bar" data-name="s-4" data-val="16" style="width:16px; height:16px;"></div>
    <div class="bar" data-name="s-5" data-val="24" style="width:24px; height:24px;"></div>
    <div class="bar" data-name="s-6" data-val="32" style="width:32px; height:32px;"></div>
    <div class="bar" data-name="s-7" data-val="48" style="width:48px; height:48px;"></div>
    <div class="bar" data-name="s-8" data-val="64" style="width:64px; height:64px;"></div>
    <div class="bar" data-name="s-9" data-val="96" style="width:96px; height:96px;"></div>
    <div class="bar" data-name="s-10" data-val="128" style="width:128px; height:128px;"></div>
  </div>
  <div class="ftr">spacing · 4px base · 4 8 12 16 24 32 48 64 96 128 192</div>
</body>
</html>
