<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--fg1); }
  body { width: 700px; padding: 24px 28px; box-sizing: border-box; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; }
  .titlebar { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--hair-dark); margin-bottom: 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg3); }
  .dot { width: 10px; height: 10px; border: 1px solid var(--fg3); }
  .dim { color: var(--fg2); }
  .acc { color: var(--accent-pink); }
  .ok  { color: var(--accent-lime); }
  .warn { color: var(--accent-yellow); }
  .blink { display: inline-block; width: 8px; height: 14px; background: var(--accent-pink); vertical-align: text-bottom; animation: blink 1s steps(2,start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  pre { margin: 0; }
</style>
</head>
<body>
  <div class="titlebar">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <span style="margin-left:auto">~/projects/apex — zenship send</span>
  </div>
<pre><span class="acc">$</span> zenship send --prod
<span class="dim">→ resolving</span> apex.zenship.dev
<span class="dim">→ bundling</span> functions   <span class="ok">[ok]</span> 38ms
<span class="dim">→ deploying</span> edge       <span class="ok">[ok]</span> 1.2s
<span class="dim">→ flushing</span> cache       <span class="warn">[skip]</span> --no-cache

shipped → <span style="text-decoration:underline">https://apex.zenship.dev</span>
<span class="acc">❯</span> <span class="blink"></span></pre>
</body>
</html>
